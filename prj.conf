# prj.conf for HID Volume Control (Just Works / Pairing Mode)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WB09 Remote"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=1

# Services
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_MODEL="WB09-Remote"
CONFIG_BT_DIS_MANUF="ST"
CONFIG_BT_BAS=y

# Security (Just Works)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_FIXED_PASSKEY=n

# Match Controller Resources (WB09 has exactly 1 ACL buffer)
CONFIG_BT_BUF_ACL_TX_COUNT=1
CONFIG_BT_CONN_TX_MAX=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=2

# Broaden compatibility
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# Disable Service Changed indication
CONFIG_BT_GATT_SERVICE_CHANGED=n

# Large stacks for stability
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE=2048

# GPIO and Logging
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_L2CAP_LOG_LEVEL_DBG=y
CONFIG_BT_ATT_LOG_LEVEL_DBG=y
CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
